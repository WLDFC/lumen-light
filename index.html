<!DOCTYPE html>
<!--
    LumenLight 主页面
    ================
    这是整个应用的单页入口文件，负责：
    1. 引入项目所需的全部 CSS 样式文件。
    2. 定义页面的 DOM 结构，包括画布层、文件菜单、提示词面板、左下角控制区等。
    3. 按依赖顺序引入全部 JavaScript 脚本文件。

    页面采用深色主题（data-theme="dark"），所有组件均通过原生 JavaScript 初始化，
    不依赖 Vue / React 等前端框架。
-->
<html lang="zh-CN" data-theme="dark">
<head>
    <!-- 页面基础元信息 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumenLight</title>

    <!--
        样式表引入区域
        ---------------
        所有 CSS 文件都集中在这里，按从通用到特殊的顺序加载：
        1. style.css：项目基础样式、CSS 变量、画布默认样式。
        2. prompt-panel.css：右侧面板（提示词、工作流、缩略图）的样式。
        3. image-toolbar.css：图片选中时浮动工具栏的样式。
        4. save-manager.css：顶栏文件菜单及存档相关弹窗的样式。
        5. prompt-autocomplete.css：提示词输入框自动补全下拉列表的样式。
        6. llm-chat.css：右侧面板 LLM 聊天窗口的样式。
        7. top-toolbar.css：画布顶部横向工具栏的样式。
    -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/prompt-panel.css">
    <link rel="stylesheet" href="css/comfy-params.css">
    <link rel="stylesheet" href="css/lora-manager.css">
    <link rel="stylesheet" href="css/workflow-manager.css">
    <link rel="stylesheet" href="css/image-toolbar.css">
    <link rel="stylesheet" href="css/gen-info.css">
    <link rel="stylesheet" href="css/image-editor.css">
    <!-- ImageStudio 三件套按此顺序加载（拆分契约见 image-studio.css 文件头） -->
    <link rel="stylesheet" href="css/image-studio.css">
    <link rel="stylesheet" href="css/image-studio-panel.css">
    <link rel="stylesheet" href="css/image-studio-picker.css">
    <link rel="stylesheet" href="css/image-studio-adjust.css">
    <link rel="stylesheet" href="css/save-manager.css">
    <link rel="stylesheet" href="css/backup.css">
    <link rel="stylesheet" href="css/prompt-autocomplete.css">
    <link rel="stylesheet" href="css/llm-chat.css">
    <link rel="stylesheet" href="css/lumen-dropdown.css">
    <!-- 通用预制件：右键菜单 / 批量管理 / 层级树列表 / 确认弹窗
         （收藏页与 LoRA 管理器共用，见 js/components/Lumen*.js） -->
    <link rel="stylesheet" href="css/lumen-context-menu.css">
    <link rel="stylesheet" href="css/lumen-batch.css">
    <link rel="stylesheet" href="css/lumen-tree-list.css">
    <link rel="stylesheet" href="css/lumen-confirm.css">
    <!-- 通用预制件：PS 式色板取色器（灯箱 ImageStudio 与漫画编辑器共用，
         见 js/components/LumenColorPicker.js） -->
    <link rel="stylesheet" href="css/lumen-color-picker.css">
    <link rel="stylesheet" href="css/lora-file-select.css">
    <link rel="stylesheet" href="css/lora-trigger.css">
    <link rel="stylesheet" href="css/llm-system-prompt.css">
    <link rel="stylesheet" href="css/comfy-prompt-presets.css">
    <link rel="stylesheet" href="css/llm-skills.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/side-toolbar.css">
    <link rel="stylesheet" href="css/asset-library.css">
    <link rel="stylesheet" href="css/task-center.css">
    <link rel="stylesheet" href="css/recipe-manager.css">
    <!-- 提示词收藏页左侧模型标签栏样式 -->
    <link rel="stylesheet" href="css/recipe-models-sidebar.css">
    <!-- 保存提示词弹窗 / 收藏详情编辑弹窗样式（从 recipe-manager.css 按组件拆分） -->
    <link rel="stylesheet" href="css/save-tag-dialog.css">
    <link rel="stylesheet" href="css/tag-detail-dialog.css">
    <!-- 坐标编辑器（顶栏按钮：bbox 布局 → MOSS/Flux3 坐标提示词）；窗口壳复用
         recipe-manager.css 的 recipe-dialog 骨架，须在其后加载 -->
    <link rel="stylesheet" href="css/coordinate-editor.css">
    <!-- 漫画编辑器（顶栏按钮，坐标编辑左侧；一期复制坐标编辑器改名分叉），
         同样复用 recipe-dialog 骨架，类前缀 .manga-* 与坐标编辑器互不相干。
         三件套按序加载：窗口壳 → 左右面板 → 舞台（选择器互不相交，
         契约测试 test/css/mangaEditorCss.test.js 防回归） -->
    <link rel="stylesheet" href="css/manga-editor.css">
<link rel="stylesheet" href="css/manga-adjust.css">
    <link rel="stylesheet" href="css/manga-panel.css">
    <link rel="stylesheet" href="css/manga-stage.css">
    <link rel="stylesheet" href="css/node.css">
    <!-- 顶栏样式放在 save-manager.css / prompt-panel.css 之后，
         以便覆盖被收纳进顶栏的按钮原有的 fixed 定位相关声明 -->
    <link rel="stylesheet" href="css/top-toolbar.css">
    <!-- 工作流编辑器（顶栏 Comfy 按钮：节点图 + 参数编辑）样式 -->
    <link rel="stylesheet" href="css/workflow-editor.css">
</head>
<body>
    <!--
        ==================== 画布层 ====================
        整个应用最核心的交互区域，所有图片都在这里被绘制、拖拽、缩放。
        通过 HTML5 Canvas API 渲染，由 js/canvas/Canvas.js 进行管理。
    -->
    <canvas id="board"></canvas>

    <!--
        ==================== 顶部工具栏 ====================
        画布顶部一条 60px 高的横向工具栏，采用三段式布局：
        - 左段：文件菜单按钮 + 当前画布名称（原左上角浮动元素）
        - 中段：图像管理等全局工具按钮，后续新增工具在此追加
        - 右段：提示词面板开关按钮（原右上角浮动元素）
        以不透明浮层盖在画布之上，画布尺寸不变；层级低于右侧面板，
        面板展开时会盖过顶栏右端。
        对应样式：css/top-toolbar.css
    -->
    <div class="top-toolbar" id="topToolbar">
        <!-- 左段：文件菜单 + 画布名称 -->
        <div class="top-toolbar-left">
            <button class="file-menu-btn" id="fileMenuBtn" title="文件菜单"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <span class="canvas-name-display" id="canvasNameDisplay" title="当前画布名称">未命名</span>
            <!-- 实时保存状态（RealtimeSaveManager 驱动，失败才告警）：
                 ✓ 已自动保存 HH:MM:SS（正常） / ⚠ 保存失败，正在重试（红色） -->
            <span class="autosave-status" id="autosaveStatus" title="实时保存状态"></span>
        </div>

        <!-- 中段：工具按钮区（图像管理等功能后续在此添加） -->
        <div class="top-toolbar-center" id="topToolbarCenter"></div>

        <!-- 右段：提示词面板开关 -->
        <div class="top-toolbar-right">
            <button class="prompt-panel-btn" id="promptBtn" title="提示词面板"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        </div>
    </div>

    <!--
        ==================== 文件菜单下拉框 ====================
        由顶栏左段的文件菜单按钮触发，fixed 定位悬浮在顶栏下方。
        必须放在顶栏容器之外，避免被顶栏的高度和层级裁剪。
        对应组件：js/components/SaveManager.js
    -->
    <div class="file-menu-dropdown" id="fileMenuDropdown">
        <button class="file-menu-item" id="openSaveBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>打开画布</button>
        <button class="file-menu-item" id="newCanvasBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>新建画布</button>
        <button class="file-menu-item" id="saveProjectBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存画布</button>
        <button class="file-menu-item" id="saveAsBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>另存为</button>
        <button class="file-menu-item" id="backupExportBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>备份导出</button>
        <button class="file-menu-item" id="backupImportBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>备份导入</button>
        <button class="file-menu-item" id="settingsBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
        <button class="file-menu-item" id="helpBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>帮助</button>
    </div>

    <!--
        ==================== 右侧面板（全高） ====================
        这是 ComfyUI 工作流的核心操作区，包含：
        - 正面 / 负面提示词输入框
        - 图片缩略图槽位（用于传递给 ComfyUI 的 Edit 类工作流）
        - 工作流选择、保存、删除
        - ComfyUI 连接状态指示灯
        - 运行工作流按钮
        - LLM 聊天窗口（与大语言模型对话，支持模型选择与图片上传）
    -->
    <aside class="prompt-panel-container" id="promptPanel" aria-hidden="true">
        <!-- 面板头部：模式切换、ComfyUI 状态灯、关闭按钮 -->
        <header class="prompt-panel-header">
            <select class="prompt-mode-selector" id="promptMode" aria-label="选择模式">
                <option value="comfy">Comfy</option>
                <option value="llm">LLM</option>
            </select>

            <!-- pi 智能体健康状态灯：紧贴模式选择器右侧（margin-right:auto 吸附）。
                 灰=未运行 / 绿=健康 / 黄=疑似卡死 / 红=已崩溃；
                 黄/红可点击重启（kill 后自动拉起接续会话），仅 LLM 模式显示。
                 组件：js/components/PiStatusLight.js -->
            <div class="pi-status-indicator" id="piStatus" title="智能体状态">
                <span class="status-dot"></span>
                <span class="status-text"></span>
            </div>

            <!-- pi 调用统计灰字（上下文 token · 缓存命中率），仅 LLM 模式显示；
                 数据来自 pi message_end 的 message.usage，样式对齐顶栏自动保存灰字 -->
            <span class="pi-usage-status" id="piUsageStatus" style="display:none"></span>

            <!-- ComfyUI 连接状态指示灯，显示 ComfyUI 服务是否可连接 -->
            <div class="comfy-status-indicator" id="comfyStatus" title="ComfyUI 连接状态">
                <span class="status-dot"></span>
                <span class="status-text">检测中...</span>
            </div>

            <!-- 头部图标按钮组：系统提示词按钮由 JS 插入到清空按钮前，
                 形成「系统提示词 - 清空对话 - 收起」图标组（组内间距见 .prompt-header-actions） -->
            <div class="prompt-header-actions">
                <!-- 清空对话按钮（图标：垃圾桶；仅 LLM 模式显示，显隐由 LlmChat 控制） -->
                <button class="llm-header-icon-btn" id="llmClearBtn" type="button" title="清空对话"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
            </div>

            <!-- 收起右侧面板按钮（图标：双箭头向内收拢） -->
            <button class="prompt-close-btn" id="closePrompt" aria-label="收起面板"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg></button>
        </header>

        <!--
            ==================== Comfy 模式内容区 ====================
            包含提示词输入、缩略图槽位、工作流管理、发送按钮。
        -->
        <section class="prompt-panel-content" id="comfyContent">
            <!--
                正面提示词输入区域：两个独立输入框，折叠交互与负面提示词一致。
                - 框 1：质量/画风类提示词（长期稳定，少改动）
                - 框 2：人物/动作/服装等内容提示词（常改动）
                发送时由 PromptInputManager.getPrompts() 将两个非空框各自
                trim 后用空行合并为一条正面提示词。默认展开，手动折叠状态
                记忆在 localStorage（posPrompt1Collapsed / posPrompt2Collapsed）
            -->
            <div class="prompt-input-wrap collapsible" id="posPrompt1Wrap">
                <div class="collapsible-header" id="posPrompt1Header">
                    <label for="posPrompt">正面提示词 1</label>
                    <button class="collapse-toggle" id="posPrompt1Toggle" aria-label="展开/收起正面提示词 1" type="button">▶</button>
                </div>
                <div class="collapsible-body">
                    <textarea id="posPrompt" rows="10" placeholder="masterpiece, best quality..."></textarea>
                </div>
            </div>

            <div class="prompt-input-wrap collapsible" id="posPrompt2Wrap">
                <div class="collapsible-header" id="posPrompt2Header">
                    <label for="posPrompt2">正面提示词 2</label>
                    <button class="collapse-toggle" id="posPrompt2Toggle" aria-label="展开/收起正面提示词 2" type="button">▶</button>
                </div>
                <div class="collapsible-body">
                    <textarea id="posPrompt2" rows="10"></textarea>
                </div>
            </div>

            <!--
                图片缩略图区域（Edit 工作流槽位上传，与提示词文本无关）。
                槽位数量由 PanelThumbnailManager 按所选工作流里取图节点
                （LumenReceiveImageFromCanvas）的个数动态渲染：
                0 个（纯文生图）时整区隐藏，最多 3 个（与后端槽位上限一致）。
                点击槽位可打开本地文件选择框上传图片，点击 × 可清空槽位。
            -->
            <div class="prompt-input-wrap" id="thumbnailWrap">
                <div class="image-thumbnails" id="imageThumbnails"></div>
            </div>

            <!--
                负面提示词输入区域，默认可折叠以节省空间。
                标题条与「提示词」按钮同排（cpp-topbar，与 LORA 叠加栏的
                「触发词」按钮同款结构：标题条 flex:1 近乎通栏、按钮在栏外
                右侧独立成钮 stretch 等高）；按钮唤出提示词预设管理弹窗
                （ComfyPromptPresets，一键注入正面 1/2 与负面框）
            -->
            <div class="prompt-input-wrap collapsible collapsed" id="negPromptWrap">
                <div class="cpp-topbar">
                    <div class="collapsible-header" id="negPromptHeader">
                        <label for="negPrompt">负面提示词</label>
                        <button class="collapse-toggle" id="negPromptToggle" aria-label="展开/收起负面提示词" type="button">▶</button>
                    </div>
                    <button type="button" class="cpp-topbar-btn" id="comfyPresetBtn" title="提示词预设：管理正面/负面提示词，一键注入">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>提示词
                    </button>
                </div>
                <div class="collapsible-body">
                    <textarea id="negPrompt" rows="6" placeholder="low quality, blurry..."></textarea>
                </div>
            </div>

            <!--
                ==================== 工作流管理区域 ====================
                功能：
                - 从服务器加载已保存的工作流列表
                - 选择工作流
                - 保存 / 重命名 / 删除工作流
            -->
            <div class="workflow-manager">
                <div class="workflow-header">
                    <label>工作流</label>
                </div>

                <!-- 工作流选择下拉框 -->
                <select class="workflow-selector" id="workflowSelector">
                    <option value="">-- 选择工作流 --</option>
                </select>

                <!-- 当前工作流信息已精简：仅保留工作流选择器，节省面板空间 -->

                <!-- 工作流状态提示文字 -->
                <div class="workflow-status" id="workflowStatus">未加载工作流</div>
            </div>

            <!--
                ComfyUI 动态参数区：随所选工作流探测渲染可调参数
                （主模型/LoRA/步数+CFG/采样器+降噪/尺寸/数量），
                与画布 Comfy 生图节点共用 ComfyParamRows 控制器；
                运行时参数经 /api/comfy-node/run 的 overrides 注入
            -->
            <div class="comfy-params" id="comfyParams"></div>

            <!-- 发送当前提示词和工作流到 ComfyUI 生成图片。
                 左侧小步进器为生成数量（工作流含批次输入时显示，
                 上下箭头步进 / 直接键入，1-9999），值经参数区状态注入 batch_size -->
            <div class="prompt-send-row">
